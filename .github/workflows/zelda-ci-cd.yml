name: Zelda CI/CD

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]         # v1.0.0, v1.2.3, etc.
  pull_request:
    branches: [ "main" ]

jobs:

  # ============================================================
  # Build & Test — runs on every push and every PR
  # ============================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test all modules
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  # ============================================================
  # Deploy — only on version tags (v*)
  # ============================================================
  deploy:
    name: Deploy to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 with GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set Maven version from tag
        run: |
          mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.VERSION }}
          mvn --batch-mode versions:commit

      - name: Deploy all modules to GitHub Packages
        run: mvn --batch-mode --no-transfer-progress deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restrict packages to org members only
        run: |
          for package in zelda-core zelda-paper zelda-velocity zelda-database \
                         zelda-configuration zelda-messaging zelda-ui zelda-injection \
                         zelda-outbox zelda-builder; do
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/kgo-mc/packages/maven/net.kgomc.zelda%3A${package}" \
              -d '{"visibility":"private"}' || true
          done